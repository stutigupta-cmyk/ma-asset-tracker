name: Sync Google Sheet to data.json

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch data from Google Apps Script
        run: |
          curl -sL "${{ secrets.APPS_SCRIPT_URL }}" \
            -o response.json \
            --max-time 30 \
            --retry 2

      - name: Validate response
        run: |
          if ! jq -e '.data | length > 0' response.json > /dev/null 2>&1; then
            echo "ERROR: Invalid or empty response:"
            cat response.json
            exit 1
          fi
          echo "Records fetched: $(jq '.data | length' response.json)"

      - name: Write data.json
        run: cp response.json data.json

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "No changes — skipping commit"
          else
            RECORD_COUNT=$(jq '.data | length' data.json)
            git commit -m "chore: sync sheet data (${RECORD_COUNT} records)"
            git push
          fi
